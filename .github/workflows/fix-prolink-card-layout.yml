name: Fix ProLink AI card layout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-prolink-card-layout.yml

permissions:
  contents: write

jobs:
  fix-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make ProLink AI card full-width and horizontally uniform
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('style.css')
          css = p.read_text(encoding='utf-8')
          marker = '/* ProLink AI horizontal full-width layout */'
          if marker not in css:
              css += '''\n\n/* ProLink AI horizontal full-width layout */\n.prolink-case{grid-column:1/-1;display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:stretch;background:linear-gradient(120deg,#0e2038,#0c1727)}\n.prolink-case .aico-visual{align-self:stretch;height:100%}\n.prolink-case .project-content{display:flex;flex-direction:column;justify-content:center}\n.prolink-case .case-study-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:24px}\n@media(max-width:900px){.prolink-case{grid-template-columns:1fr}.prolink-case .project-content{justify-content:flex-start}}\n'''
              p.write_text(css, encoding='utf-8')
          PY

      - name: Commit layout fix
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css
          git commit -m "Make ProLink AI portfolio card horizontally uniform"
          git push
