name: Link project ordering helper

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/link-project-order.yml

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert project ordering script
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          script = '  <script src="project-order.js?v=20260914-0351"></script>\n'
          if 'project-order.js' not in text:
              anchor = '  <script src="script.js"></script>\n'
              if anchor not in text:
                  raise SystemExit('script.js anchor not found')
              text = text.replace(anchor, anchor + script, 1)
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Position ProLink AI above Northbay Family Clinic"
          git push
