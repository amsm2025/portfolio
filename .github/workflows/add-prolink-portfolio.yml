name: Add ProLink AI to portfolio

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-prolink-portfolio.yml

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update portfolio index
        run: python .github/scripts/add_prolink_portfolio.py

      - name: Commit portfolio update
        run: |
          if git diff --quiet; then
            echo "No portfolio changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add ProLink AI project and live demo to portfolio"
          git push
