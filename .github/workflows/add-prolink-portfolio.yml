name: Add ProLink AI to portfolio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-prolink-portfolio.yml'

permissions:
  contents: write

jobs:
  update-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add ProLink AI project card and roadmap entry
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if 'prolink-ai.html' not in text:
              card = '''
        <article class="project-case prolink-case">
          <div class="aico-visual" role="img" aria-label="ProLink AI architecture overview">
            <div class="aico-visual-head"><span class="tag">AI / FULL STACK / TALENT TECH</span><span class="aico-badge">LIVE</span></div>
            <h3>ProLink AI</h3>
            <p class="aico-subtitle">AI-powered professional networking & talent platform</p>
            <div class="aico-architecture">
              <div class="aico-layer aico-ai"><strong>Role-Aware AI Assistant</strong><span>Career Copilot • Recruiter Assistant • Context-Aware Guidance</span></div>
              <div class="aico-connector"></div>
              <div class="aico-layer"><strong>Application & API Layer</strong><span>Next.js • FastAPI • JWT • REST</span></div>
              <div class="aico-modules"><span>Profiles</span><span>Network</span><span>Jobs</span><span>Applications</span><span>Recruiter</span><span>Chat</span><span>Auth</span><span>Analytics</span></div>
              <div class="aico-layer aico-data"><strong>Data & Deployment</strong><span>SQLAlchemy • PostgreSQL-ready • Render</span></div>
            </div>
          </div>
          <div class="project-content">
            <div class="project-topline"><span class="tag">AI / PROFESSIONAL NETWORKING / FULL STACK</span><span class="project-number">05</span></div>
            <h3>ProLink AI — AI-Powered Professional Networking & Talent Platform</h3>
            <p class="project-summary">An original professional networking and talent platform combining profiles, connections, jobs, applications and recruiter workflows with an authenticated, role-aware AI assistant grounded in application data.</p>
            <div class="case-study-grid">
              <div class="case-study-item"><strong>Problem</strong><span>Professional-networking demos often stop at profiles and job listings without demonstrating how AI can safely use authenticated product context for practical career and recruiting workflows.</span></div>
              <div class="case-study-item"><strong>Solution</strong><span>Built a full-stack networking and talent platform with professional and recruiter experiences plus a contextual AI assistant for job fit, skill gaps, profile guidance, candidate summaries and outreach drafting.</span></div>
              <div class="case-study-item"><strong>Engineering</strong><span>Implemented Next.js and TypeScript on the frontend, FastAPI and SQLAlchemy on the backend, JWT-protected APIs, role-gated recruiter context, persistent chat history, CI and independent Render services.</span></div>
              <div class="case-study-item"><strong>Demo Resilience</strong><span>Added deterministic fallback behavior so the public AI demonstration remains usable when no external model key is configured or a provider is temporarily unavailable.</span></div>
            </div>
            <div class="project-tech"><span>Next.js</span><span>React</span><span>TypeScript</span><span>FastAPI</span><span>Python</span><span>SQLAlchemy</span><span>JWT</span><span>AI Assistant</span><span>GitHub Actions</span><span>Render</span></div>
            <div class="project-actions">
              <a class="project-link" href="https://prolink-ai.onrender.com" target="_blank" rel="noopener">Live Demo ↗</a>
              <a class="project-link secondary-link" href="prolink-ai.html">View Case Study →</a>
              <a class="project-link secondary-link" href="https://github.com/amsm2025/prolink-ai" target="_blank" rel="noopener">GitHub Repository ↗</a>
            </div>
          </div>
        </article>
'''
              marker = '\n      </div>\n    </section>\n\n    <section id="roadmap"'
              if marker not in text:
                  raise SystemExit('Projects/roadmap insertion marker not found')
              text = text.replace(marker, '\n' + card + '      </div>\n    </section>\n\n    <section id="roadmap"', 1)

          old = '<div class="roadmap-items"><span>Healthcare AI Voice Agent</span><span>Northbay Family Clinic</span><span>MediVoice AI</span><span>MediDx AI</span><span>HMO Doctor Finder</span></div>'
          new = '<div class="roadmap-items"><span>Healthcare AI Voice Agent</span><span>Northbay Family Clinic</span><span>MediVoice AI</span><span>MediDx AI</span><span>HMO Doctor Finder</span><span>ProLink AI</span></div>'
          if old in text:
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit portfolio update
        run: |
          if git diff --quiet; then
            echo "No portfolio changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add ProLink AI project and live demo to portfolio"
          git push
